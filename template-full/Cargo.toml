[workspace]
members = [
    "editor",
    "executor",
    "executor-wasm",
    "executor-android",
    "export-cli",
    "game",
    "game-dylib",
]
resolver = "2"

[workspace.dependencies.fyrox]
version = "1.0.1"
default-features = false
[workspace.dependencies.fyroxed_base]
version = "1.0.1"
default-features = false
[workspace.dependencies.fyrox-build-tools]
version = "1.0.1"

# Separate build profiles for hot reloading. These profiles ensure that build
# artifacts for hot reloading go into their own folders and do not interfere
# with standard (static) linking.
[profile.dev-hot-reload]
inherits = "dev"
[profile.release-hot-reload]
inherits = "release"

# Optimize the engine in debug builds, but leave the project's code
# non-optimized. Debug builds stay debuggable without being painfully slow.
[profile.dev.package."*"]
opt-level = 3
